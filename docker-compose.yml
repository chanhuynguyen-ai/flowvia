# Local development. PostgreSQL is the durable Lite workflow queue.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flowvia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d flowvia"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/flowvia
      CREDENTIAL_KEY_FILE: /app/.data/credential.key
    volumes:
      - credential_data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *app-environment
    volumes:
      - credential_data:/app/.data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/flowvia-worker.heartbeat') < 120"]
      interval: 10s
      timeout: 3s
      retries: 18

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Reserved for file intake and later queue adapters; unused by the Lite runtime.
  redis:
    image: redis:7-alpine
    profiles: [extras]
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    profiles: [extras]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-change_me}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change_me_too}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  credential_data:
  minio_data:
