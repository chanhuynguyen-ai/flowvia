[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowvia-api"
version = "0.1.0"
description = "Flowvia modular monolith API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "SQLAlchemy==2.0.50",
  "alembic==1.18.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "psycopg[binary]==3.3.5",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
